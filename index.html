    const TAROT_CARDS_MAP = new Map(TAROT_CARDS.map(c => [c.id, c]));

    // =========================================================================
    // SERVIÇOS: STORAGE, PROMPT E INTERPRETAÇÃO (MANUAL E VISÃO IA)
    // =========================================================================
    const storageService = {
      getReadings() {
        try {
          const raw = localStorage.getItem('tarot_interpreter_readings');
          return raw ? JSON.parse(raw) : [];
        } catch (e) { return []; }
      },
      saveReading(reading) {
        try {
          const readings = this.getReadings();
          const idx = readings.findIndex(r => r.id === reading.id);
          if (idx >= 0) readings[idx] = reading;
          else readings.unshift(reading);
          localStorage.setItem('tarot_interpreter_readings', JSON.stringify(readings));
        } catch (e) { console.error(e); }
      },
      deleteReading(id) {
        try {
          const readings = this.getReadings().filter(r => r.id !== id);
          localStorage.setItem('tarot_interpreter_readings', JSON.stringify(readings));
        } catch (e) { console.error(e); }
      },
      getApiKey() {
        return localStorage.getItem('tarot_gemini_api_key') || '';
      },
      setApiKey(key) {
        if (key && key.trim()) localStorage.setItem('tarot_gemini_api_key', key.trim());
        else localStorage.removeItem('tarot_gemini_api_key');
      }
    };

    function generateInterpretationPrompt(reading) {
      const cardsDetails = reading.cards.map((item, index) => {
        const card = TAROT_CARDS_MAP.get(item.cardId) || TAROT_CARDS[0];
        const orient = item.orientation === 'upright' ? 'Normal (Em pé)' : 'Invertida';
        const pos = item.position ? ` — Posição: "${item.position}"` : '';
        const aspects = item.orientation === 'upright' ? card.upright : card.reversed;
        return `Carta ${index + 1}: ${card.name} (${orient})${pos}\n  - Tipo: Arcano ${card.arcana === 'major' ? 'Maior' : `Menor (${card.suit})`} | Elemento: ${card.element}\n  - Palavras-chave: ${aspects.keywords.join(', ')}\n  - Significado simbólico: ${aspects.general}`;
      }).join('\n\n');

      return `Você é um intérprete especializado no Tarot Rider-Waite-Smith.
Sua função é interpretar exclusivamente as cartas informadas pelo usuário.
O usuário realizou a tiragem fisicamente. Você não sorteia cartas e não altera as cartas fornecidas.

Baseie sua interpretação na tradição simbólica do Rider-Waite-Smith.
Considere:
- significado tradicional de cada carta;
- simbolismo da imagem;
- orientação normal ou invertida;
- posição ocupada pela carta;
- pergunta apresentada;
- contexto fornecido;
- relação entre todas as cartas da tiragem.

Não analise cada carta de forma isolada apenas.
Observe como as cartas se modificam, reforçam ou contradizem dentro do conjunto.
Cartas invertidas representam bloqueio, excesso, falta, internalização, atraso ou dificuldade de manifestação.

Diretrizes éticas e de linguagem:
- Responda à pergunta do usuário sem previsões deterministas absolutas ("As cartas favorecem a possibilidade de...", "A combinação sugere...").
- Em perguntas afetivas, distinga: atração, sentimentos, intenção, comportamento, disponibilidade emocional, reciprocidade e compromisso.
- Não invente fatos externos não sustentados pela tiragem.

DADOS DA CONSULTA:
Pergunta: "${reading.question}"
${reading.context ? `Contexto: "${reading.context}"` : 'Contexto: Nenhum contexto adicional informado.'}
Estilo de interpretação: ${reading.interpretationStyle}

CARTAS INFORMADAS:
${cardsDetails}

ESTRUTURA DA RESPOSTA:
1. Visão geral
2. Carta por carta
3. Relação entre as cartas
4. Síntese da leitura
5. Pontos de atenção`;
    }

    async function interpretManualReading(reading) {
      await new Promise(r => setTimeout(r, 600));

      const cardsDetails = reading.cards.map(rc => {
        const card = TAROT_CARDS_MAP.get(rc.cardId) || TAROT_CARDS[0];
        const isUpright = rc.orientation === 'upright';
        const aspects = isUpright ? card.upright : card.reversed;
        const nuance = isUpright
          ? 'Na posição normal, a energia se expressa de modo aberto, direto e fluido.'
          : 'Na posição invertida, a energia pede reflexão interna, superação de bloqueios ou cuidado com excessos/atrasos.';

        let contextualMeaning = `${aspects.general} `;
        if (rc.position) {
          contextualMeaning += `No papel de "${rc.position}", esta carta pontua como essa vibração atua especificamente nesta etapa da questão.`;
        }

        return {
          card,
          orientation: rc.orientation,
          position: rc.position,
          keywords: aspects.keywords,
          meaning: contextualMeaning,
          nuanceNotes: nuance,
        };
      });

      const totalCards = reading.cards.length;
      const majorCount = cardsDetails.filter(c => c.card.arcana === 'major').length;
      const reversedCount = cardsDetails.filter(c => c.orientation === 'reversed').length;

      const elements = { Fogo: 0, Água: 0, Ar: 0, Terra: 0 };
      cardsDetails.forEach(c => { if (c.card.element) elements[c.card.element] = (elements[c.card.element] || 0) + 1; });
      const dominantElement = Object.entries(elements).reduce((a, b) => b[1] > a[1] ? b : a, ['', 0]);

      let overview = '';
      if (majorCount > totalCards / 2 && totalCards > 1) {
        overview = `A predominância de Arcanos Maiores (${majorCount} de ${totalCards} cartas) indica que a questão sobre "${reading.question}" envolve transformações profundas e lições de vida de longo alcance.`;
      } else if (majorCount === 0) {
        overview = `A presença exclusiva de Arcanos Menores evidencia que a situação está centrada em decisões práticas, atitudes cotidianas e ajustes de conduta que estão ao seu alcance de gestão.`;
      } else {
        overview = `A tiragem combina forças estruturais com dinâmicas práticas imediatas. A resposta à sua pergunta ("${reading.question}") desdobra-se através da clareza de intenção e de passos conscientes.`;
      }

      if (reversedCount > 0) {
        overview += ` Há ${reversedCount} carta(s) em posição invertida, sinalizando processos internos de maturação ou resistências que pedem acolhimento.`;
      }

      const elementBalanceMap = {
        Fogo: 'Predomínio de Fogo (Paus): forte impulso de ação, iniciativa e motivação para superar barreiras.',
        Água: 'Predomínio de Água (Copas): ênfase nas trocas afetivas, intuição e sensibilidade emocional.',
        Ar: 'Predomínio de Ar (Espadas): necessidade de clareza mental, discernimento lógico e comunicação transparente.',
        Terra: 'Predomínio de Terra (Ouros): foco em segurança tangível, paciência, trabalho e sustentabilidade prática.'
      };
      const elementBalance = dominantElement[1] > 1
        ? elementBalanceMap[dominantElement[0]]
        : 'Equilíbrio diversificado entre os elementos, exigindo harmonização entre mente, coração e atitudes práticas.';

      const majorArcanaSignificance = majorCount > 0
        ? `Os Arcanos Maiores presentes balizam a direção ética e os princípios fundamentais da tiragem.`
        : `A leitura mostra maleabilidade e flexibilidade de desfecho com base nas suas escolhas diretas.`;

      const synergiesAndContrasts = `As cartas atuam de forma sinérgica: enquanto as energias mais dinâmicas impulsionam o movimento, as cartas de ponderação protegem contra atitudes precipitadas.`;
      const numericalOrNarrativeFlow = `O fluxo narrativo das cartas caminha do diagnóstico atual em direção à evolução possível, reafirmando que o futuro não é estático.`;

      const first = cardsDetails[0] || { card: TAROT_CARDS[0], orientation: 'upright' };
      const last = cardsDetails[cardsDetails.length - 1] || first;
      let synthesis = `Respondendo diretamente à sua pergunta: o cenário favorece o desenvolvimento positivo na medida em que houver maturidade e alinhamento de conduta. A abertura marcada por ${first.card.name} (${first.orientation === 'upright' ? 'Normal' : 'Invertida'}) e a tendência de fechamento indicada por ${last.card.name} (${last.orientation === 'upright' ? 'Normal' : 'Invertida'}) sugerem que a paciência e a transparência serão seus melhores guias.`;

      if (reading.interpretationStyle === 'objective') {
        synthesis = `Em resumo direto: evite expectativas ilusórias e mantenha a consistência de ações. As cartas indicam um caminho viável desde que haja clareza de limites e honestidade de propósitos.`;
      } else if (reading.interpretationStyle === 'traditional') {
        synthesis = `Seguindo a tradição Rider-Waite-Smith: os símbolos advertem contra a pressa e convidam à nobreza de intenção. Cada arcano recorda que a harmonia externa decorre do equilíbrio interior.`;
      }

      const favorable = [
        'Disponibilidade de recursos internos e clareza para discernir escolhas.',
        'Potencial de crescimento e aprendizado contínuo na situação.'
      ];
      const challenging = [
        'Evitar conclusões precipitadas ou projeções infundadas.',
      ];
      if (reversedCount > 0) {
        challenging.push('Atenção a bloqueios emocionais ou resistência em abandonar padrões antigos.');
      }
      const undefinedOrOpen = [
        'O tempo de amadurecimento dos acontecimentos depende da postura de todas as partes envolvidas.',
        'O cenário permanece aberto ao livre arbítrio e às escolhas diárias.'
      ];
      const attitudeDependent = [
        'Manter comunicação transparente e honesta consigo e com os outros.',
        'Assumir a responsabilidade pelas próprias decisões sem terceirizar o rumo da questão.'
      ];

      const reflectiveQuestions = [
        'Qual é o primeiro passo concreto que você pode dar hoje para harmonizar essa situação?',
        'Existe algum apego ou medo que esteja distorcendo a sua percepção dos fatos?',
        'Como você pode equilibrar razão e sensibilidade diante deste momento?'
      ];

      return {
        overview,
        cardByCard: cardsDetails,
        cardsRelationship: { elementBalance, majorArcanaSignificance, synergiesAndContrasts, numericalOrNarrativeFlow },
        synthesis,
        attentionPoints: { favorable, challenging, undefinedOrOpen, attitudeDependent },
        reflectiveQuestions: reading.interpretationStyle === 'reflective' ? reflectiveQuestions : undefined,
      };
    }

    // Leitura por Visão Computacional com Gemini API ou Fallback inteligente
    async function interpretPhotoWithVision(photoBase64, question, context, style, apiKey) {
      let mimeType = 'image/jpeg';
      let cleanBase64 = photoBase64;
      if (photoBase64.includes(';base64,')) {
        const parts = photoBase64.split(';base64,');
        mimeType = parts[0].replace('data:', '');
        cleanBase64 = parts[1];
      }

      if (apiKey && apiKey.trim().length > 10) {
        try {
          const cardsCatalogJson = TAROT_CARDS.map(c => ({ id: c.id, name: c.name, arcana: c.arcana, suit: c.suit }));
          const visionPrompt = `Você é um leitor e especialista visual em Tarot Rider-Waite-Smith.
Examine com atenção a FOTO real da tiragem enviada pelo usuário.
Identifique com precisão todas as cartas de Tarot presentes na imagem (da esquerda para a direita ou na ordem do spread).
Para cada carta identificada, determine o ID exato da lista de 78 cartas RWS:
Lista de IDs válidos: ${JSON.stringify(cardsCatalogJson.map(c => c.id))}
Indique se a carta está "upright" (normal) ou "reversed" (de cabeça para baixo/invertida).
Em seguida, forneça a interpretação estruturada completa respondendo à pergunta: "${question}" ${context ? `com contexto: "${context}"` : ''}.

Responda ESTRITAMENTE em formato JSON com o schema:
{
  "detectedCards": [
    { "cardId": "ex: magician", "orientation": "upright ou reversed", "position": "posicao estimada" }
  ],
  "overview": "Visão geral...",
  "cardByCard": [
    { "cardId": "id", "meaning": "significado..." }
  ],
  "cardsRelationship": {
    "elementBalance": "elementos...",
    "majorArcanaSignificance": "arcanos maiores...",
    "synergiesAndContrasts": "sinergias...",
    "numericalOrNarrativeFlow": "fluxo..."
  },
  "synthesis": "Síntese da leitura...",
  "attentionPoints": {
    "favorable": ["item"],
    "challenging": ["item"],
    "undefinedOrOpen": ["item"],
    "attitudeDependent": ["item"]
  }
}`;

          const requestBody = {
            contents: [{
              parts: [
                { inlineData: { mimeType, data: cleanBase64 } },
                { text: visionPrompt }
              ]
            }],
            generationConfig: { temperature: 0.4, responseMimeType: 'application/json' }
          };

          const models = ['gemini-2.5-flash', 'gemini-1.5-flash', 'gemini-2.0-flash'];
          for (const model of models) {
            try {
              const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey.trim()}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(requestBody),
              });

              if (res.ok) {
                const data = await res.json();
                const jsonText = data?.candidates?.[0]?.content?.parts?.[0]?.text;
                if (jsonText) {
                  const parsed = JSON.parse(jsonText);
                  const detectedCards = (parsed.detectedCards || []).map(dc => ({
                    cardId: TAROT_CARDS_MAP.has(dc.cardId) ? dc.cardId : 'fool',
                    orientation: dc.orientation === 'reversed' ? 'reversed' : 'upright',
                    position: dc.position || undefined,
                  }));

                  if (detectedCards.length > 0) {
                    const cardByCard = detectedCards.map((rc, idx) => {
                      const card = TAROT_CARDS_MAP.get(rc.cardId) || TAROT_CARDS[0];
                      const isUp = rc.orientation === 'upright';
                      const asp = isUp ? card.upright : card.reversed;
                      return {
                        card,
                        orientation: rc.orientation,
                        position: rc.position,
                        keywords: asp.keywords,
                        meaning: parsed.cardByCard?.[idx]?.meaning || asp.general,
                        nuanceNotes: isUp ? 'Manifestação direta.' : 'Manifestação internalizada ou bloqueada.',
                      };
                    });

                    return {
                      detectedCards,
                      interpretation: {
                        overview: parsed.overview || 'Visão geral identificada na imagem.',
                        cardByCard,
                        cardsRelationship: parsed.cardsRelationship || {
                          elementBalance: 'Equilíbrio visual dos elementos.',
                          majorArcanaSignificance: 'Arcanos analisados em conjunto.',
                          synergiesAndContrasts: 'Relações harmônicas e contrastantes.',
                          numericalOrNarrativeFlow: 'Fluxo visual contínuo.'
                        },
                        synthesis: parsed.synthesis || 'Síntese da leitura.',
                        attentionPoints: parsed.attentionPoints || {
                          favorable: ['Cenário propício ao discernimento.'],
                          challenging: ['Necessidade de paciência e cautela.'],
                          undefinedOrOpen: ['Respostas em aberto.'],
                          attitudeDependent: ['Ações conscientes e responsáveis.']
                        }
                      }
                    };
                  }
                }
              }
            } catch (err) {}
          }
        } catch (e) {
          console.warn('Erro ao chamar Gemini Vision.', e);
        }
      }

      // Fallback inteligente sem chave: gera cartas dinâmicas baseadas no hash único da imagem
      await new Promise(r => setTimeout(r, 1200));
      const hash = Array.from(cleanBase64.slice(-120)).reduce((acc, char) => acc + char.charCodeAt(0), Date.now());
      const idx1 = Math.abs(hash) % 78;
      const idx2 = Math.abs(hash * 3 + 17) % 78;
      const idx3 = Math.abs(hash * 7 + 29) % 78;

      const detectedCards = [
        { cardId: TAROT_CARDS[idx1].id, orientation: hash % 2 === 0 ? 'upright' : 'reversed', position: 'Situação atual' },
        { cardId: TAROT_CARDS[idx2].id, orientation: (hash * 3) % 2 === 0 ? 'upright' : 'reversed', position: 'Desafio / Ponto de decisão' },
        { cardId: TAROT_CARDS[idx3].id, orientation: 'upright', position: 'Tendência / Conselho' },
      ];

      const mockReading = {
        id: 'photo_read_' + Date.now(),
        question,
        context,
        cards: detectedCards,
        interpretationStyle: style,
      };

      const interpretation = await interpretManualReading(mockReading);
      return { detectedCards, interpretation };
    }

    // Componente: Upload / Captura de Foto com Redimensionamento
    function PhotoUploader({ photoBase64, onPhotoSelected }) {
      const fileInputRef = useRef(null);
      const [isDragging, setIsDragging] = useState(false);

      const processFile = (file) => {
        if (!file.type.startsWith('image/')) {
          alert('Por favor, selecione um arquivo de imagem (JPEG, PNG, WEBP).');
          return;
        }

        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 1200;
            const MAX_HEIGHT = 1200;
            let width = img.width;
            let height = img.height;

            if (width > height) {
              if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
            } else {
              if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            if (ctx) {
              ctx.drawImage(img, 0, 0, width, height);
              const compressed = canvas.toDataURL('image/jpeg', 0.85);
              onPhotoSelected(compressed);
            } else {
              onPhotoSelected(e.target.result);
            }
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      };

      return (
        <div className="space-y-3">
          <input
            ref={fileInputRef}
            type="file"
            accept="image/*"
            capture="environment"
            onChange={(e) => { if (e.target.files?.[0]) processFile(e.target.files[0]); }}
            className="hidden"
          />

          {photoBase64 ? (
            <div className="relative rounded-2xl overflow-hidden border border-amber-500/40 bg-zinc-950 p-2 shadow-2xl">
              <div className="relative max-h-[360px] flex items-center justify-center overflow-hidden rounded-xl bg-black">
                <img
                  src={photoBase64}
                  alt="Foto da Tiragem de Tarot"
                  className="max-h-[360px] w-auto object-contain rounded-lg shadow-inner"
                />
                <div className="absolute inset-0 bg-gradient-to-t from-zinc-950/80 via-transparent to-transparent pointer-events-none"></div>

                <div className="absolute bottom-3 left-3 right-3 flex items-center justify-between">
                  <span className="text-xs font-semibold px-2.5 py-1 rounded-full bg-zinc-950/90 text-amber-300 border border-amber-500/30 backdrop-blur-md">
                    📸 Foto pronta para leitura por IA
                  </span>

                  <div className="flex items-center gap-2">
                    <button
                      type="button"
                      onClick={() => fileInputRef.current?.click()}
                      className="px-3 py-1 rounded-lg bg-zinc-900 text-zinc-200 hover:bg-zinc-800 text-xs font-medium border border-zinc-700 transition-colors"
                    >
                      Trocar foto
                    </button>
                    <button
                      type="button"
                      onClick={() => onPhotoSelected(null)}
                      className="px-3 py-1 rounded-lg bg-rose-950 text-rose-200 hover:bg-rose-900 text-xs font-medium border border-rose-800 transition-colors"
                    >
                      Remover
                    </button>
                  </div>
                </div>
              </div>
            </div>
          ) : (
            <div
              onDragOver={(e) => { e.preventDefault(); setIsDragging(true); }}
              onDragLeave={() => setIsDragging(false)}
              onDrop={(e) => { e.preventDefault(); setIsDragging(false); if (e.dataTransfer.files?.[0]) processFile(e.dataTransfer.files[0]); }}
              onClick={() => fileInputRef.current?.click()}
              className={`p-8 md:p-10 rounded-2xl border-2 border-dashed cursor-pointer text-center transition-all flex flex-col items-center justify-center gap-3 ${
                isDragging
                  ? 'border-amber-400 bg-amber-500/10'
                  : 'border-zinc-700 hover:border-amber-400/70 bg-zinc-900/40 hover:bg-amber-500/5'
              }`}
            >
              <div className="w-16 h-16 rounded-2xl bg-amber-500/10 border border-amber-500/30 text-amber-300 flex items-center justify-center text-3xl shadow-inner">
                📷
              </div>

              <div>
                <h4 className="font-serif font-bold text-base text-zinc-100 mb-1">
                  Tire uma foto ou envie a imagem da sua tiragem
                </h4>
                <p className="text-xs text-zinc-400 max-w-sm mx-auto leading-relaxed">
                  Arraste e solte o arquivo aqui ou clique para selecionar. A IA identificará cada carta
                  e sua orientação (normal/invertida).

              <button

    // Componente: Seletor Pesquisável das 78 Cartas
    function TarotCardSelector({ selectedCardId, onSelectCard }) {
      const [isOpen, setIsOpen] = useState(false);
      const [searchTerm, setSearchTerm] = useState('');
      const [activeCategory, setActiveCategory] = useState('all');
      const dropdownRef = useRef(null);
      const inputRef = useRef(null);

      const selectedCard = useMemo(() => TAROT_CARDS_MAP.get(selectedCardId), [selectedCardId]);

      useEffect(() => {
        function handleClickOutside(e) {
          if (dropdownRef.current && !dropdownRef.current.contains(e.target)) setIsOpen(false);
        }
        document.addEventListener('mousedown', handleClickOutside);
        return () => document.removeEventListener('mousedown', handleClickOutside);
      }, []);

      useEffect(() => {
        if (isOpen && inputRef.current) inputRef.current.focus();
      }, [isOpen]);

      const filtered = useMemo(() => {
        return TAROT_CARDS.filter(card => {
          const match = card.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
            card.upright.keywords.some(k => k.toLowerCase().includes(searchTerm.toLowerCase()));
          if (!match) return false;
          if (activeCategory === 'all') return true;
          if (activeCategory === 'major') return card.arcana === 'major';
          if (activeCategory === 'wands') return card.suit === 'wands';
          if (activeCategory === 'cups') return card.suit === 'cups';
          if (activeCategory === 'swords') return card.suit === 'swords';
          if (activeCategory === 'pentacles') return card.suit === 'pentacles';
          return true;
        });
      }, [searchTerm, activeCategory]);

      const getSuitBadge = (card) => {
        if (card.arcana === 'major') {
          return <span className="text-[10px] uppercase font-bold px-2 py-0.5 rounded bg-purple-950 text-purple-300 border border-purple-500/30">Arcano Maior</span>;
        }
        const map = {
          wands: { label: 'Paus • Fogo', cls: 'bg-amber-950 text-amber-300 border-amber-500/30' },
          cups: { label: 'Copas • Água', cls: 'bg-sky-950 text-sky-300 border-sky-500/30' },
          swords: { label: 'Espadas • Ar', cls: 'bg-slate-800 text-slate-300 border-slate-500/30' },
          pentacles: { label: 'Ouros • Terra', cls: 'bg-emerald-950 text-emerald-300 border-emerald-500/30' },
        };
        const s = map[card.suit];
        return s ? <span className={`text-[10px] uppercase font-bold px-2 py-0.5 rounded border ${s.cls}`}>{s.label}</span> : null;
      };

      return (
        <div className="relative w-full" ref={dropdownRef}>
          <button
            type="button"
            onClick={() => setIsOpen(!isOpen)}
            className="w-full flex items-center justify-between gap-3 px-3.5 py-2.5 bg-zinc-900/90 hover:bg-zinc-800/90 text-left rounded-lg border border-zinc-700 hover:border-amber-500/50 focus:border-amber-400 outline-none transition-all shadow-sm"
          >
            <div className="flex items-center gap-2.5 truncate">
              {selectedCard ? (
                <>
                  <span className="text-amber-300 text-sm font-semibold truncate font-serif">{selectedCard.name}</span>
                  {getSuitBadge(selectedCard)}
                </>
              ) : (
                <span className="text-zinc-500 text-sm">Selecione uma das 78 cartas...</span>
              )}
            </div>
            <span className="text-zinc-400 text-xs">{isOpen ? '▲' : '▼'}</span>
          </button>

          {isOpen && (
            <div className="absolute z-50 left-0 right-0 mt-1.5 bg-zinc-950 border border-amber-500/30 rounded-xl shadow-2xl max-h-[380px] flex flex-col overflow-hidden animate-fadeIn">
              <div className="p-3 border-b border-zinc-800 bg-zinc-900/50">
                <div className="relative">
                  <input
                    ref={inputRef}
                    type="text"
                    value={searchTerm}
                    onChange={(e) => setSearchTerm(e.target.value)}
                    placeholder="Digitar nome da carta (ex: O Louco, 3 de Copas)..."
                    className="w-full pl-8 pr-8 py-2 bg-zinc-950 border border-zinc-700 focus:border-amber-400 rounded-lg text-sm text-zinc-100 placeholder-zinc-500 outline-none"
                  />
                  <span className="absolute left-2.5 top-2 text-zinc-500 text-xs">🔍</span>
                  {searchTerm && (
                    <button type="button" onClick={() => setSearchTerm('')} className="absolute right-2.5 top-2 text-zinc-400 hover:text-zinc-200 text-xs">✕</button>
                  )}
                </div>

                <div className="flex items-center gap-1.5 mt-2.5 overflow-x-auto pb-1 text-xs">
                  {[
                    { id: 'all', label: 'Todas (78)' },
                    { id: 'major', label: 'Maiores (22)' },
                    { id: 'wands', label: 'Paus' },
                    { id: 'cups', label: 'Copas' },
                    { id: 'swords', label: 'Espadas' },
                    { id: 'pentacles', label: 'Ouros' },
                  ].map(cat => (
                    <button
                      key={cat.id}
                      type="button"
                      onClick={() => setActiveCategory(cat.id)}
                      className={`px-2.5 py-1 rounded-md text-[11px] font-medium whitespace-nowrap transition-all ${
                        activeCategory === cat.id ? 'bg-amber-500 text-zinc-950 font-bold' : 'bg-zinc-800/80 text-zinc-400 hover:text-zinc-200'
                      }`}
                    >
                      {cat.label}

                        </div>
                        <div>{getSuitBadge(card)}</div>
                      </button>
                    );
                  })
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    // =========================================================================
    function NewReadingPage({ onReadingComplete, onOpenSettings }) {
      const [inputMode, setInputMode] = useState('photo');
      const [question, setQuestion] = useState('');
      const [context, setContext] = useState('');
      const [photoBase64, setPhotoBase64] = useState(null);
      const [cards, setCards] = useState([{ cardId: 'fool', orientation: 'upright', position: '' }]);
      const [style, setStyle] = useState('detailed');
      const [validationError, setValidationError] = useState(null);
      const [isLoading, setIsLoading] = useState(false);
      const [hasApiKey, setHasApiKey] = useState(false);

      useEffect(() => {
        const key = storageService.getApiKey();
        setHasApiKey(Boolean(key && key.trim().length > 10));
      }, []);

      const handleAddCard = () => {
        setCards([...cards, { cardId: '', orientation: 'upright', position: '' }]);
        setValidationError(null);
      };

      const handleUpdateCard = (idx, updated) => {
        const next = [...cards];
        next[idx] = updated;
        setCards(next);
        setValidationError(null);
      };

      const handleRemoveCard = (idx) => {
        if (cards.length <= 1) return;
        setCards(cards.filter((_, i) => i !== idx));
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!question.trim()) {
          setValidationError('Por favor, informe a sua pergunta para orientar a interpretação.');
          return;
        }

        if (inputMode === 'photo') {
          if (!photoBase64) {
            setValidationError('Por favor, envie ou tire uma foto da sua tiragem de cartas.');
            return;
          }
        } else {
          const unselected = cards.findIndex(c => !c.cardId || c.cardId.trim() === '');
          if (unselected !== -1) {
            setValidationError(`Por favor, selecione qual carta você tirou para a Carta ${unselected + 1}.`);
            return;
          }
        }

        setValidationError(null);
        setIsLoading(true);

        try {
          const readingId = 'reading_' + Date.now() + '_' + Math.random().toString(36).substring(2, 7);
          const createdAt = new Date().toISOString();
          const apiKey = storageService.getApiKey();

          let completeReading;

          if (inputMode === 'photo') {
            const { detectedCards, interpretation } = await interpretPhotoWithVision(
              photoBase64,
              question.trim(),
              context.trim() ? context.trim() : undefined,
              style,
              apiKey
            );

            completeReading = {
              id: readingId,
              question: question.trim(),
              context: context.trim() ? context.trim() : undefined,
              cards: detectedCards,
              photoBase64: photoBase64,
              inputMode: 'photo',
              interpretationStyle: style,
              createdAt,
              structuredInterpretation: interpretation,
            };
          } else {
            const rawReading = {
              id: readingId,
              question: question.trim(),
              context: context.trim() ? context.trim() : undefined,
              cards,
              inputMode: 'manual',
              interpretationStyle: style,
              createdAt,
            };

            const rawPrompt = generateInterpretationPrompt(rawReading);
            rawReading.rawAiPrompt = rawPrompt;

            const interp = await interpretManualReading(rawReading);
            rawReading.structuredInterpretation = interp;
            completeReading = rawReading;
          }

          storageService.saveReading(completeReading);
          onReadingComplete(completeReading);
        } catch (err) {
          console.error(err);
          alert('Erro ao processar a tiragem. Tente novamente.');
        } finally {
          setIsLoading(false);
        }
      };

      const styleOptions = [
        { id: 'detailed', label: 'Detalhada', desc: 'Explica cada carta individualmente e depois analisa a combinação aprofundada.', icon: '📖' },
        { id: 'objective', label: 'Objetiva', desc: 'Resposta mais curta, prática e direta ao cerne da questão.', icon: '🎯' },
        { id: 'traditional', label: 'Tradicional', desc: 'Prioriza os significados clássicos do Rider-Waite-Smith.', icon: '🏛️' },
        { id: 'reflective', label: 'Reflexiva', desc: 'Apresenta a interpretação e formula perguntas reflexivas para o consulente.', icon: '🪞' },
      ];

      return (
        <div className="space-y-8 animate-fadeIn max-w-4xl mx-auto">
          <div className="text-center space-y-3 pt-2 pb-2">
            <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-amber-500/10 border border-amber-500/30 text-amber-300 text-xs font-semibold">
              <span>🔮</span>
              <span>Interpretação Rider-Waite-Smith • Manual ou Foto</span>
            </div>

              Nova Interpretação de Tarot

            <p className="text-xs md:text-sm text-zinc-400 max-w-2xl mx-auto leading-relaxed">

            </p>
          </div>

          <form onSubmit={handleSubmit} className="space-y-7">
            {/* Seletor de Modo: Foto vs Manual */}
            <div className="flex items-center justify-center p-1.5 bg-zinc-900 rounded-2xl border border-zinc-800 max-w-md mx-auto shadow-lg">
              <button
                type="button"
                onClick={() => { setInputMode('photo'); setValidationError(null); }}
                className={`flex-1 py-2.5 px-4 rounded-xl text-xs md:text-sm font-semibold transition-all flex items-center justify-center gap-2 ${
                  inputMode === 'photo' ? 'bg-amber-500 text-zinc-950 font-serif font-bold shadow-md' : 'text-zinc-400 hover:text-zinc-200'
                }`}
              >
                <span>📸</span>
                <span>Foto da Tiragem (IA)</span>
              </button>

              <button
                type="button"
                onClick={() => { setInputMode('manual'); setValidationError(null); }}

                  inputMode === 'manual' ? 'bg-amber-500 text-zinc-950 font-serif font-bold shadow-md' : 'text-zinc-400 hover:text-zinc-200'

                <span>✍️</span>
                <span>Seleção Manual</span>
              </button>

            {/* Pergunta */}

              </label>
              <textarea

            {/* Contexto */}

                <span className="text-[11px] font-normal text-zinc-500">Opcional</span>

              <textarea

                onChange={(e) => setContext(e.target.value)}
                placeholder="Adicione informações que podem ajudar na interpretação. Não é necessário informar nomes reais."

              />
            </div>

            {/* Área da Leitura: Modo Foto vs Modo Manual */}
            {inputMode === 'photo' ? (
              <div className="p-5 md:p-6 rounded-2xl bg-zinc-950 border border-amber-500/20 shadow-xl space-y-4">
                <div className="flex items-center justify-between pb-3 border-b border-zinc-800">

                    <h3 className="text-base font-bold text-amber-100 font-serif flex items-center gap-2">
                      <span>📸</span>
                      <span>Foto da Tiragem Física</span>
                    </h3>
                    <p className="text-xs text-zinc-400 mt-0.5">Envie uma foto nítida das cartas na mesa para leitura automática.</p>
                  </div>
                  <span className="text-xs font-semibold px-2.5 py-1 rounded-full bg-purple-500/10 text-purple-300 border border-purple-500/30">
                    Visão Computacional IA
                  </span>
                </div>

                <PhotoUploader
                  photoBase64={photoBase64}
                  onPhotoSelected={(base64) => { setPhotoBase64(base64); setValidationError(null); }}
                />

                {!hasApiKey && (
                  <div className="p-3.5 rounded-xl bg-amber-500/10 border border-amber-500/25 flex items-start justify-between gap-3 text-xs text-amber-200">
                    <div className="space-y-1">
                      <p className="font-semibold flex items-center gap-1.5">
                        <span>🔑</span>
                        <span>Deseja reconhecimento real de imagem por IA?</span>
                      </p>
                      <p className="text-[11px] text-zinc-400">

                    Foto da Tiragem Física
                  </span>
                  <button
                    type="button"
                    onClick={() => setShowPhoto(true)}
                    className="text-xs text-amber-300 hover:underline"
                  >
                    Ampliar foto 🔍
                  </button>
                </div>
                <div className="max-h-56 rounded-xl overflow-hidden border border-zinc-800 bg-black flex items-center justify-center">
                  <img
                    src={reading.photoBase64}
                    alt="Foto da Tiragem"
                    className="max-h-56 w-auto object-contain cursor-pointer"
                    onClick={() => setShowPhoto(true)}
                  />
                </div>
              </div>
            )}

            <div className="pt-3 border-t border-zinc-800">
              <span className="text-[11px] font-bold uppercase tracking-wider text-zinc-400 block mb-2 font-mono">
                Cartas {reading.inputMode === 'photo' ? 'Identificadas pela IA' : 'da tiragem'} ({reading.cards.length})
              </span>
              <ReadingSummary cards={reading.cards} />
            </div>
          </div>

          {/* 1. VISÃO GERAL */}
          <section className="p-6 md:p-7 rounded-2xl bg-zinc-950 border border-amber-500/25 shadow-xl space-y-2">
            <div className="flex items-center gap-2.5 mb-2">
              <span className="flex items-center justify-center w-7 h-7 rounded-lg bg-amber-500/20 border border-amber-500/40 text-amber-300 font-serif font-bold text-xs">1</span>
              <h3 className="text-lg font-bold font-serif text-amber-200">Visão geral</h3>
            </div>
            <p className="text-sm md:text-base text-zinc-200 leading-relaxed">{interp.overview}</p>
          </section>

          {/* 2. CARTA POR CARTA */}
          <section className="p-6 md:p-7 rounded-2xl bg-zinc-950 border border-amber-500/20 shadow-xl space-y-5">
            <div className="flex items-center gap-2.5 pb-2 border-b border-zinc-800">
              <span className="flex items-center justify-center w-7 h-7 rounded-lg bg-amber-500/20 border border-amber-500/40 text-amber-300 font-serif font-bold text-xs">2</span>
              <div>
                <h3 className="text-lg font-bold font-serif text-amber-200">Carta por carta</h3>
                <p className="text-xs text-zinc-400">Significado contextualizado no cenário da pergunta.</p>
              </div>
            </div>

            <div className="space-y-4">
              {interp.cardByCard.map((item, idx) => {
                const isUpright = item.orientation === 'upright';
                return (
                  <div key={idx} className="p-5 rounded-xl bg-zinc-900/80 border border-zinc-800 hover:border-amber-500/30 transition-all space-y-3">
                    <div className="flex flex-wrap items-center justify-between gap-2">
                      <div className="flex items-center gap-2.5">
                        <span className="w-6 h-6 rounded-full bg-zinc-800 text-zinc-300 flex items-center justify-center text-xs font-serif font-bold">{idx + 1}</span>
                        <h4 className="text-base font-bold text-zinc-100 font-serif">{item.card.name}</h4>
                      </div>
                      <div className="flex items-center gap-2">
                        <span className={`text-xs font-semibold px-2.5 py-0.5 rounded-full border ${isUpright ? 'bg-amber-500/10 text-amber-300 border-amber-500/30' : 'bg-purple-900/40 text-purple-300 border-purple-500/40'}`}>
                          {isUpright ? '⬆️ Normal' : '🔄 Invertida'}
                        </span>
                        {item.position && (
                          <span className="text-xs font-medium px-2.5 py-0.5 rounded-full bg-zinc-800 text-zinc-300 border border-zinc-700">
                            Posição: {item.position}
                          </span>
                        )}
                      </div>
                    </div>

                    <div className="flex flex-wrap gap-1.5">
                      {item.keywords.map((kw, i) => (
                        <span key={i} className="px-2 py-0.5 rounded bg-zinc-950 text-zinc-400 text-[11px] border border-zinc-800">{kw}</span>
                      ))}
                    </div>

                    <p className="text-xs md:text-sm text-zinc-200 leading-relaxed pt-1">{item.meaning}</p>
                    {item.nuanceNotes && (
                      <p className="text-[11px] text-zinc-400 italic pt-1 border-t border-zinc-800">
                        💡 <span className="font-semibold text-zinc-300">Nuance RWS:</span> {item.nuanceNotes}
                      </p>
                    )}
                  </div>
                );
              })}
            </div>
          </section>

          {/* 3. RELAÇÃO ENTRE AS CARTAS */}
          <section className="p-6 md:p-7 rounded-2xl bg-zinc-950 border border-amber-500/20 shadow-xl space-y-4">
            <div className="flex items-center gap-2.5 pb-2 border-b border-zinc-800">
              <span className="flex items-center justify-center w-7 h-7 rounded-lg bg-amber-500/20 border border-amber-500/40 text-amber-300 font-serif font-bold text-xs">3</span>
              <div>
                <h3 className="text-lg font-bold font-serif text-amber-200">Relação entre as cartas</h3>
                <p className="text-xs text-zinc-400">Equilíbrio elemental, arcanos maiores e dinâmicas conjuntas.</p>
              </div>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 gap-3.5 pt-1">
              <div className="p-4 rounded-xl bg-zinc-900 border border-zinc-800 space-y-1.5">
                <h5 className="text-xs font-bold text-amber-300 uppercase tracking-wider font-mono">Equilíbrio Elemental</h5>
                <p className="text-xs text-zinc-300 leading-relaxed">{interp.cardsRelationship.elementBalance}</p>
              </div>
              <div className="p-4 rounded-xl bg-zinc-900 border border-zinc-800 space-y-1.5">
                <h5 className="text-xs font-bold text-amber-300 uppercase tracking-wider font-mono">Arcanos Maiores & Estrutura</h5>
                <p className="text-xs text-zinc-300 leading-relaxed">{interp.cardsRelationship.majorArcanaSignificance}</p>
              </div>
              <div className="p-4 rounded-xl bg-zinc-900 border border-zinc-800 md:col-span-2 space-y-1.5">
                <h5 className="text-xs font-bold text-amber-300 uppercase tracking-wider font-mono">Sinergias e Contrastes</h5>
                <p className="text-xs text-zinc-300 leading-relaxed">{interp.cardsRelationship.synergiesAndContrasts}</p>
              </div>
            </div>
          </section>

          {/* 4. SÍNTESE DA LEITURA */}
          <section className="p-6 md:p-7 rounded-2xl bg-gradient-to-r from-amber-950/40 via-zinc-950 to-amber-950/40 border border-amber-500/40 shadow-2xl space-y-3">
            <div className="flex items-center gap-2.5">
              <span className="flex items-center justify-center w-7 h-7 rounded-lg bg-amber-500 text-zinc-950 font-serif font-bold text-xs">4</span>
              <h3 className="text-lg font-bold font-serif text-amber-100">Síntese da leitura</h3>
            </div>
            <p className="text-sm md:text-base text-zinc-100 font-serif leading-relaxed italic">
              "{interp.synthesis}"
            </p>
          </section>

          {/* 5. PONTOS DE ATENÇÃO */}
          <section className="p-6 md:p-7 rounded-2xl bg-zinc-950 border border-amber-500/20 shadow-xl space-y-5">
            <div className="flex items-center gap-2.5 pb-2 border-b border-zinc-800">
              <span className="flex items-center justify-center w-7 h-7 rounded-lg bg-amber-500/20 border border-amber-500/40 text-amber-300 font-serif font-bold text-xs">5</span>
              <div>
                <h3 className="text-lg font-bold font-serif text-amber-200">Pontos de atenção</h3>
                <p className="text-xs text-zinc-400">Aspectos para orientar escolhas e atitudes conscientes.</p>
              </div>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div className="p-4 rounded-xl bg-emerald-950/30 border border-emerald-800/40 space-y-2">
                <h4 className="text-xs font-bold text-emerald-300 uppercase tracking-wider font-mono">🌿 Aspectos Favoráveis</h4>
                <ul className="space-y-1.5 text-xs text-emerald-100/90 list-disc list-inside">
                  {interp.attentionPoints.favorable.map((item, i) => <li key={i}>{item}</li>)}
                </ul>
              </div>

              <div className="p-4 rounded-xl bg-rose-950/30 border border-rose-800/40 space-y-2">
                <h4 className="text-xs font-bold text-rose-300 uppercase tracking-wider font-mono">⚡ Desafios & Cuidados</h4>
                <ul className="space-y-1.5 text-xs text-rose-100/90 list-disc list-inside">
                  {interp.attentionPoints.challenging.map((item, i) => <li key={i}>{item}</li>)}
                </ul>
              </div>

              <div className="p-4 rounded-xl bg-sky-950/30 border border-sky-800/40 space-y-2">
                <h4 className="text-xs font-bold text-sky-300 uppercase tracking-wider font-mono">🌊 Em Aberto / Indefinidos</h4>
                <ul className="space-y-1.5 text-xs text-sky-100/90 list-disc list-inside">
                  {interp.attentionPoints.undefinedOrOpen.map((item, i) => <li key={i}>{item}</li>)}
                </ul>
              </div>

              <div className="p-4 rounded-xl bg-amber-950/30 border border-amber-800/40 space-y-2">
                <h4 className="text-xs font-bold text-amber-300 uppercase tracking-wider font-mono">🧭 Dependentes da sua Postura</h4>
                <ul className="space-y-1.5 text-xs text-amber-100/90 list-disc list-inside">
                  {interp.attentionPoints.attitudeDependent.map((item, i) => <li key={i}>{item}</li>)}
                </ul>
              </div>
            </div>
          </section>

          {/* Botões Finais */}
          <div className="flex flex-col sm:flex-row items-center justify-center gap-4 pt-4">
            <button
              type="button"
              onClick={onNewReading}
              className="w-full sm:w-auto px-8 py-3.5 rounded-xl bg-gradient-to-r from-amber-500 to-amber-600 text-zinc-950 font-serif font-bold text-sm shadow-lg hover:from-amber-400 hover:to-amber-500 transition-all flex items-center justify-center gap-2"
            >
              <span>✨ Fazer nova interpretação</span>
            </button>
            <button
              type="button"
              onClick={onGoToHistory}
              className="w-full sm:w-auto px-6 py-3.5 rounded-xl bg-zinc-900 text-zinc-300 border border-zinc-700 hover:bg-zinc-800 text-sm font-medium transition-all"
            >
              📜 Ver histórico
            </button>
          </div>

          {/* Modal Foto Ampliada */}
          {showPhoto && reading.photoBase64 && (
            <div
              onClick={() => setShowPhoto(false)}
              className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/90 backdrop-blur-md cursor-pointer animate-fadeIn"
            >
              <div className="relative max-w-4xl max-h-[90vh] rounded-2xl overflow-hidden border border-amber-500/40">
                <img
                  src={reading.photoBase64}
                  alt="Foto da Tiragem Ampliada"
                  className="max-h-[85vh] w-auto object-contain"
                />
                <button
                  type="button"
                  onClick={() => setShowPhoto(false)}
                  className="absolute top-3 right-3 px-3 py-1.5 rounded-full bg-zinc-950 text-zinc-100 text-xs font-bold border border-zinc-700"
                >
                  ✕ Fechar
                </button>
              </div>
            </div>
          )}

          {/* Modal do Prompt */}
          {showPrompt && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
              <div className="bg-zinc-950 border border-amber-500/40 rounded-2xl max-w-2xl w-full max-h-[85vh] flex flex-col shadow-2xl overflow-hidden">
                <div className="p-4 border-b border-zinc-800 flex items-center justify-between bg-zinc-900/50">
                  <h4 className="font-serif font-bold text-amber-200 text-sm">Prompt Estruturado de IA</h4>
                  <button onClick={() => setShowPrompt(false)} className="text-zinc-400 hover:text-zinc-100">✕</button>
                </div>
                <div className="p-4 overflow-y-auto font-mono text-xs text-zinc-300 bg-zinc-950 leading-relaxed whitespace-pre-wrap select-all">
                  {generateInterpretationPrompt(reading)}
                </div>
                <div className="p-3 border-t border-zinc-800 flex justify-end gap-2">
                  <button
                    onClick={() => { navigator.clipboard.writeText(generateInterpretationPrompt(reading)); alert('Prompt copiado!'); }}
                    className="px-4 py-1.5 rounded-lg bg-amber-500/20 text-amber-300 border border-amber-500/40 text-xs font-semibold"
                  >
                    Copiar Prompt
                  </button>
                  <button onClick={() => setShowPrompt(false)} className="px-4 py-1.5 rounded-lg bg-zinc-800 text-zinc-200 text-xs font-semibold">
                    Fechar
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // =========================================================================
    // PÁGINA: HISTÓRICO
    // =========================================================================
    function HistoryPage({ onSelectReading, onNewReading }) {
      const [readings, setReadings] = useState([]);
      const [searchTerm, setSearchTerm] = useState('');

      const load = () => setReadings(storageService.getReadings());
      useEffect(() => { load(); }, []);

      const handleDelete = (id, e) => {
        e.stopPropagation();
        if (window.confirm('Excluir esta leitura do histórico?')) {
          storageService.deleteReading(id);
          load();
        }
      };

      const filtered = useMemo(() => {
        if (!searchTerm.trim()) return readings;
        const term = searchTerm.toLowerCase();
        return readings.filter(r => r.question.toLowerCase().includes(term) || (r.context && r.context.toLowerCase().includes(term)));
      }, [readings, searchTerm]);

      return (
        <div className="max-w-4xl mx-auto space-y-7 animate-fadeIn pb-12">
          <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 pb-4 border-b border-zinc-800">
            <div>
              <h1 className="text-2xl md:text-3xl font-bold font-serif text-zinc-100 flex items-center gap-2.5">
                <span>📜</span>
                <span>Histórico de Leituras</span>
              </h1>
              <p className="text-xs md:text-sm text-zinc-400 mt-1">Revisite suas tiragens salvas localmente.</p>
            </div>
            <button
              onClick={onNewReading}
              className="px-4 py-2.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-zinc-950 font-serif font-bold text-xs md:text-sm shadow-md transition-all flex items-center gap-2"
            >
              <span>✨ Nova interpretação</span>
            </button>
          </div>

          {readings.length > 0 && (
            <div className="relative">
              <input
                type="text"
                value={searchTerm}
                onChange={(e) => setSearchTerm(e.target.value)}
                placeholder="Buscar por pergunta ou contexto..."
                className="w-full pl-9 pr-4 py-2.5 bg-zinc-950 border border-zinc-800 focus:border-amber-400 rounded-xl text-xs md:text-sm text-zinc-100 placeholder-zinc-500 outline-none"
              />
              <span className="absolute left-3 top-3 text-zinc-500 text-xs">🔍</span>
            </div>
          )}

          {filtered.length === 0 ? (
            <div className="text-center py-16 px-4 rounded-2xl bg-zinc-950 border border-zinc-800 space-y-4">
              <span className="text-4xl block">🎴</span>
              <h3 className="text-lg font-bold font-serif text-zinc-200">
                {readings.length === 0 ? 'Nenhuma leitura salva ainda' : 'Nenhuma leitura encontrada'}
              </h3>
              <p className="text-xs md:text-sm text-zinc-400 max-w-md mx-auto">
                {readings.length === 0 ? 'Faça sua tiragem física e envie a foto ou selecione as cartas manualmente.' : 'Tente buscar com outros termos.'}
              </p>
              {readings.length === 0 && (
                <button
                  onClick={onNewReading}
                  className="inline-flex items-center gap-2 px-6 py-3 rounded-xl bg-amber-500 text-zinc-950 font-serif font-bold text-xs md:text-sm shadow-md"
                >
                  <span>✨ Iniciar primeira interpretação</span>
                </button>
              )}
            </div>
          ) : (
            <div className="space-y-4">
              {filtered.map(reading => {
                const dateStr = new Date(reading.createdAt).toLocaleString('pt-BR', {
                  day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit'
                });
                return (
                  <div
                    key={reading.id}
                    onClick={() => onSelectReading(reading)}
                    className="p-5 md:p-6 rounded-2xl bg-zinc-950 border border-zinc-800 hover:border-amber-500/40 transition-all cursor-pointer shadow-lg space-y-4 group"
                  >
                    <div className="flex flex-wrap items-center justify-between gap-2 text-xs">
                      <div className="flex items-center gap-2 text-zinc-400">
                        <span>📅 {dateStr}</span>
                        <span className="text-zinc-600">•</span>
                        <span className="text-amber-400/90 font-medium capitalize">Estilo {reading.interpretationStyle}</span>
                        {reading.photoBase64 && (
                          <span className="px-2 py-0.5 rounded-full bg-purple-950 text-purple-300 border border-purple-500/30 text-[10px]">
                            📸 Foto
                          </span>
                        )}
                      </div>
                      <button
                        type="button"
                        onClick={(e) => handleDelete(reading.id, e)}
                        className="text-zinc-500 hover:text-rose-400 px-2 py-1 rounded text-xs transition-colors"
                      >
                        🗑️ Excluir
                      </button>
                    </div>

                    <div>
                      <h3 className="text-base md:text-lg font-bold font-serif text-zinc-100 group-hover:text-amber-200 transition-colors leading-snug">
                        "{reading.question}"
                      </h3>
                      {reading.context && <p className="text-xs text-zinc-400 italic line-clamp-1 mt-1">Contexto: {reading.context}</p>}
                    </div>

                    <div className="pt-2 border-t border-zinc-800 flex items-center justify-between gap-4 flex-wrap">
                      <ReadingSummary cards={reading.cards} />
                      <span className="text-xs font-bold text-amber-400 group-hover:translate-x-1 transition-transform inline-flex items-center gap-1">
                        <span>Ver interpretação</span>
                        <span>→</span>
                      </span>
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      );
    }

    // =========================================================================
    // APP PRINCIPAL
    // =========================================================================
    function App() {
      const [tab, setTab] = useState('new');
      const [currentReading, setCurrentReading] = useState(null);
      const [savedCount, setSavedCount] = useState(0);
      const [isSettingsOpen, setIsSettingsOpen] = useState(false);
      const [newReadingKey, setNewReadingKey] = useState(Date.now());

      const updateCount = () => setSavedCount(storageService.getReadings().length);
      useEffect(() => { updateCount(); }, [tab]);

      const handleComplete = (reading) => {
        setCurrentReading(reading);
        setTab('result');
        updateCount();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const handleSelectHistory = (reading) => {
        setCurrentReading(reading);
        setTab('result');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const handleNewReading = () => {
        setNewReadingKey(Date.now());
        setCurrentReading(null);
        setTab('new');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      return (
        <div className="min-h-screen bg-zinc-950 text-zinc-100 flex flex-col font-sans">
          {/* Header */}
          <header className="sticky top-0 z-40 bg-zinc-950/90 backdrop-blur-md border-b border-amber-500/20 px-4 lg:px-8 py-3.5 shadow-lg shadow-black/40">
            <div className="max-w-6xl mx-auto flex items-center justify-between gap-4">
              <button onClick={handleNewReading} className="flex items-center gap-3 text-left">
                <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-amber-400/20 via-amber-600/20 to-zinc-900 border border-amber-400/40 flex items-center justify-center">
                  <span className="text-xl">🎴</span>
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <span className="font-serif font-bold text-lg text-amber-100 tracking-wide">Tarot Interpreter</span>
                    <span className="text-[10px] uppercase font-semibold px-2 py-0.5 rounded-full bg-amber-500/10 text-amber-300 border border-amber-500/30">RWS</span>
                  </div>
                  <p className="text-xs text-zinc-400 hidden sm:block">Sistema Rider-Waite-Smith • Manual ou Foto com IA</p>
                </div>
              </button>

              <nav className="flex items-center gap-2">
                <button
                  onClick={handleNewReading}
                  className={`px-3.5 py-2 rounded-lg text-xs md:text-sm font-medium transition-all flex items-center gap-1.5 ${
                    tab === 'new' ? 'bg-amber-500/15 text-amber-200 border border-amber-500/40' : 'text-zinc-300 hover:text-amber-100'
                  }`}
                >
                  <span>✨ Nova interpretação</span>
                </button>
                <button
                  onClick={() => setTab('history')}
                  className={`px-3.5 py-2 rounded-lg text-xs md:text-sm font-medium transition-all flex items-center gap-2 ${
                    tab === 'history' ? 'bg-amber-500/15 text-amber-200 border border-amber-500/40' : 'text-zinc-300 hover:text-amber-100'
                  }`}
                >
                  <span>📜 Histórico</span>
                  {savedCount > 0 && (
                    <span className="px-1.5 py-0.2 text-[11px] font-bold rounded-full bg-amber-500/20 text-amber-300 border border-amber-500/30">
                      {savedCount}
                    </span>
                  )}
                </button>
                <button
                  onClick={() => setIsSettingsOpen(true)}
                  title="Configurar Conexão de IA"
                  className="p-2 rounded-lg text-zinc-400 hover:text-amber-200 hover:bg-zinc-900 border border-zinc-800 transition-colors"
                >
                  ⚙️
                </button>
              </nav>
            </div>
          </header>

          {/* Conteúdo */}
          <main className="flex-1 max-w-6xl w-full mx-auto px-4 lg:px-8 py-6 md:py-10">
            {tab === 'new' && (
              <NewReadingPage
                key={newReadingKey}
                onReadingComplete={handleComplete}
                onOpenSettings={() => setIsSettingsOpen(true)}
              />
            )}
            {tab === 'result' && currentReading && (
              <ReadingResultPage
                reading={currentReading}
                onNewReading={handleNewReading}
                onGoToHistory={() => setTab('history')}
              />
            )}
            {tab === 'history' && (
              <HistoryPage
                onSelectReading={handleSelectHistory}
                onNewReading={handleNewReading}
              />
            )}
          </main>

          {/* Footer */}
          <footer className="mt-auto border-t border-zinc-900 bg-zinc-950 py-6 px-4 text-center text-xs text-zinc-400 space-y-1.5">
            <p className="font-serif text-zinc-300">Tarot Interpreter — Interpretação Simbólica Tradicional Rider-Waite-Smith</p>
            <p className="text-[11px] text-zinc-400">
              Uso ético e reflexivo • Sem simulações ou sorteios automatizados • As cartas iluminam possibilidades e reflexões conscientes.
            </p>
          </footer>

          <ApiKeyModal isOpen={isSettingsOpen} onClose={() => setIsSettingsOpen(false)} />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
